# Pełne złożenie — 5 kół na dwóch wałkach, 2 spacery (zestaw input_test).
# Łańcuch: driving_gear -> koło 1 -> koło 2 -> koło 3 -> koło 4 -> koło 5,
# każde kolejne koło napędzane ZĘBNIKIEM poprzedniego (na dużą tarczę).
# Składnia relacji opisana w etap_1_duza.yaml.
#
# Wałek A: koło 1, koło 3, koło 5, short_spacer
# Wałek B: koło 2, koło 4, long_spacer

name: "Pełne złożenie — 5 kół"
description: "driving_gear -> koło 1 -> 2 -> 3 -> 4 -> 5, na przemian na dwóch wałkach."

parts:
  engine: 1
  driving_gear: 1
  gear_big: 5
  short_spacer: 1
  long_spacer: 1

relations:
  - mesh: [driving_gear, gear_big#1]
    sections: [main, big]
    description: "driving_gear -> duża tarcza koła 1"
  - mesh: [gear_big#1, gear_big#2]
    sections: [pinion, big]
    description: "zębnik koła 1 -> duża tarcza koła 2"
  - mesh: [gear_big#2, gear_big#3]
    sections: [pinion, big]
    description: "zębnik koła 2 -> duża tarcza koła 3"
  - mesh: [gear_big#3, gear_big#4]
    sections: [pinion, big]
    description: "zębnik koła 3 -> duża tarcza koła 4"
  - mesh: [gear_big#4, gear_big#5]
    sections: [pinion, big]
    description: "zębnik koła 4 -> duża tarcza koła 5"
  - adjacent: [gear_big#1, gear_big#3]
    description: "koła 1 i 3 obok siebie na wałku A"
  - adjacent: [gear_big#3, gear_big#5]
    description: "koła 3 i 5 obok siebie na wałku A"
  - adjacent: [gear_big#2, gear_big#4]
    description: "koła 2 i 4 obok siebie na wałku B"
  - same_axis: [gear_big#1, short_spacer]
    description: "short_spacer na wałku A"
  - same_axis: [gear_big#2, long_spacer]
    description: "long_spacer na wałku B"
  - driven: gear_big#5
    description: "ostatnie koło łańcucha obraca się"
