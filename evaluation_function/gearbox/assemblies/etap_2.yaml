# Etap 2: dwa koła na sąsiednich osiach. Zazębienie dwóch gear_big
# oznacza automatycznie, że leżą na osiach obok siebie (rozstaw 15.0 mm).
# Składnia relacji opisana w etap_1_duza.yaml.

name: "Etap 2 — silnik + driving_gear + 2 koła"
description: "driving_gear -> duża tarcza koła 1; zębnik koła 1 -> duża tarcza koła 2 na osi obok."

parts:
  engine: 1
  driving_gear: 1
  gear_big: 2

relations:
  - mesh: [driving_gear, gear_big#1]
    sections: [main, big]
    description: "driving_gear zazębiony z dużą tarczą koła 1"
  - mesh: [gear_big#1, gear_big#2]
    sections: [pinion, big]
    description: "zębnik koła 1 zazębiony z dużą tarczą koła 2"
  - driven: gear_big#2
    description: "koło 2 obraca się po włączeniu silnika"
