[tool.poetry]
name = "evaluation_function"
version = "0.0.1"
description = ""
authors = ["Andreas Pfurtscheller <andreas.pfurtscheller23@ic.ac.uk>"]
readme = "README.md"
packages = [{ include = "evaluation_function" }]

[tool.poetry.scripts]
evaluation_function = "evaluation_function.main:main"
evaluation_function_dev = "evaluation_function.dev:dev"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
typing_extensions = "^4.12.2"
lf_toolkit = { git = "https://github.com/lambda-feedback/toolkit-python.git", branch = "main", extras = [
    "ipc",
] }
# Analiza GearBox (evaluation_function/gearbox). torch w wersji CUDA dla
# Cloud Run z GPU; bez karty (AWS Lambda) liczy na CPU, ale obraz jest o kilka
# GB większy ("2.11.0" pasuje też do "2.11.0+cu128" z tego indeksu).
torch = { version = "2.11.0", source = "pytorch-cu128" }
torchvision = { version = "0.26.0", source = "pytorch-cu128" }
ultralytics = ">=8.3"
opencv-python = ">=4.10"
open3d = ">=0.18"
numpy = ">=1.26"
scipy = ">=1.11"
pupil-apriltags = ">=1.0.4"
pyyaml = ">=6.0"
pillow = ">=10.0"
requests = ">=2.31"

[[tool.poetry.source]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
flake8 = "^7.1.0"

[tool.pytest.ini_options]
# gearbox/ = kod aplikacji GearBox (test_apriltag.py to nie test pytest).
testpaths = ["evaluation_function"]
norecursedirs = ["gearbox", ".venv", ".git"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
