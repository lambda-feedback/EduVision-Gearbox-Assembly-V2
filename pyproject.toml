[tool.poetry]
name = "evaluation_function"
version = "0.0.1"
description = ""
authors = ["Andreas Pfurtscheller <andreas.pfurtscheller23@ic.ac.uk>"]
readme = "README.md"
packages = [{ include = "evaluation_function" }]

[tool.poetry.scripts]
evaluation_function = "evaluation_function.main:main"
evaluation_function_dev = "evaluation_function.dev:dev"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
typing_extensions = "^4.12.2"
lf_toolkit = { git = "https://github.com/lambda-feedback/toolkit-python.git", branch = "main", extras = [
    "ipc",
] }
# Lambda has no GPU, so use CPU builds there; the CPU index has no macOS
# wheels, so other platforms use PyPI.
torch = [
    { version = ">=2.7", source = "pytorch-cpu", markers = "sys_platform == 'linux'" },
    { version = ">=2.7", markers = "sys_platform != 'linux'" },
]
# Keep torchvision new enough to pin a compatible torch version.
torchvision = [
    { version = ">=0.22.1", source = "pytorch-cpu", markers = "sys_platform == 'linux'" },
    { version = ">=0.22.1", markers = "sys_platform != 'linux'" },
]
ultralytics = ">=8.3"
opencv-python = ">=4.10"
open3d = ">=0.18"
numpy = ">=1.26"
scipy = ">=1.11"
pupil-apriltags = ">=1.0.4"
pyyaml = ">=6.0"
pillow = ">=10.0"
requests = ">=2.31"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
flake8 = "^7.1.0"

[tool.pytest.ini_options]
# gearbox/ = kod aplikacji GearBox (test_apriltag.py to nie test pytest).
testpaths = ["evaluation_function"]
norecursedirs = ["gearbox", ".venv", ".git"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
